<title>Preview móvil — hero arreglado</title>
<style>
  :root { --teal:#08b9bd; --muted:#5b7085; --shadow:0 24px 60px rgba(6,27,50,.18); --soft:0 12px 30px rgba(6,27,50,.12); }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Manrope',Arial,sans-serif; }
  body { background:#cfeef0; display:flex; gap:28px; flex-wrap:wrap; justify-content:center; padding:34px 16px; }
  .cap { text-align:center; font-weight:800; color:#06243d; margin-bottom:10px; font-size:14px; }
  .phone { width:330px; }
  .frame { width:330px; border-radius:30px; border:9px solid #0c2135; background:#dff4f5; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .bar { background:#0c2135; color:#fff; font-size:12px; text-align:center; padding:6px; }
  .media { position:relative; height:340px; margin:14px; }
  .photo { position:absolute; inset:0; border-radius:0 0 70px 0; overflow:hidden; box-shadow:var(--shadow); }
  .photo img { width:100%; height:100%; object-fit:cover; }

  /* Luxury badge — abajo izquierda */
  .overlay { position:absolute; left:14px; bottom:14px; z-index:3; display:flex; align-items:center; gap:9px;
             padding:11px 14px; border-radius:18px; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); box-shadow:var(--soft); }
  .overlay span { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:900;
                  background:linear-gradient(135deg,var(--teal),#087a98); }
  .overlay b { font-size:13px; color:#06243d; }

  /* 5-Star card — ARRIBA derecha (arreglado) */
  .rating { position:absolute; top:16px; right:14px; z-index:3; display:flex; gap:11px; align-items:center;
            padding:12px 14px; border-radius:20px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); box-shadow:var(--shadow); }
  .rating .star { width:40px; height:40px; display:grid; place-items:center; border-radius:50%; font-size:20px; color:#fff;
                  background:linear-gradient(135deg,var(--teal),#09829b); }
  .rating b { font-size:13px; color:#06243d; }
  .rating p { color:#f5a400; letter-spacing:2px; margin:2px 0; font-size:12px; }
  .rating small { color:var(--muted); font-weight:800; font-size:11px; }

  .badbox { position:absolute; border:4px solid #e0322b; border-radius:50%; width:230px; height:110px; right:-6px; bottom:6px; z-index:5; opacity:.9; }
  .tag { display:inline-block; margin-top:10px; font-size:12px; font-weight:800; padding:5px 12px; border-radius:20px; }
</style>

<div class="phone">
  <p class="cap" style="color:#a11">❌ ANTES (se encimaban)</p>
  <div class="frame">
    <div class="bar">brightmaxcleaning.com</div>
    <div class="media">
      <div class="photo"><img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80" alt=""></div>
      <div class="overlay" style="bottom:20px;"><span>BM</span><b>Luxury Home Care</b></div>
      <div class="rating" style="top:auto; bottom:16px; right:12px;"><div class="star">★</div><div><b>5-Star Service</b><p>★★★★★</p><small>500+ Happy Clients</small></div></div>
      <div class="badbox"></div>
    </div>
  </div>
  <div style="text-align:center"><span class="tag" style="background:#f6d6d3;color:#a11;">El cuadro tapaba "Luxury Home Care"</span></div>
</div>

<div class="phone">
  <p class="cap" style="color:#0a7a2e;">✅ AHORA (arreglado)</p>
  <div class="frame">
    <div class="bar">brightmaxcleaning.com</div>
    <div class="media">
      <div class="photo"><img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80" alt=""></div>
      <div class="rating"><div class="star">★</div><div><b>5-Star Service</b><p>★★★★★</p><small>500+ Happy Clients</small></div></div>
      <div class="overlay"><span>BM</span><b>Luxury Home Care</b></div>
    </div>
  </div>
  <div style="text-align:center"><span class="tag" style="background:#cdeecd;color:#0a7a2e;">Ambos se leen completos, sin encimarse</span></div>
</div>
